# ser2net config: ttyUSB0-23 -> raw TCP 3000-3023, 115200 8N1.
# Matches the defaults of RELAY_PANEL_UART_* and the uart MCP's UART_*.

%YAML 1.1
---

connection: &ttyUSB0
  accepter: tcp,3000
  connector: serialdev,/dev/ttyUSB0,115200n81,local
  options:
    kickolduser: false
    max-connections: 4

connection: &ttyUSB1
  accepter: tcp,3001
  connector: serialdev,/dev/ttyUSB1,115200n81,local
  options:
    kickolduser: false
    max-connections: 4


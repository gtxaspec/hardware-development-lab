<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Control Panel</title>
<style>
:root {
  --bg: #0f0f13;
  --surface: #1a1a24;
  --surface-hover: #22222f;
  --surface-active: #2a2a3a;
  --text: #e8e8ec;
  --text-dim: #777;
  --text-muted: #555;
  --on: #00e676;
  --on-glow: rgba(0, 230, 118, 0.25);
  --off: #555;
  --off-surface: #161620;
  --accent: #5c6bc0;
  --accent-hover: #7986cb;
  --danger: #ef5350;
  --danger-hover: #f44336;
  --focus: #42a5f5;
  --focus-ring: rgba(66, 165, 245, 0.5);
  --border: #2a2a36;
  --radius: 8px;
  --transition: 150ms ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.header h1 {
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.poll-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 150ms ease;
  flex-shrink: 0;
}

.poll-dot.active {
  background: var(--on);
}

.header-actions {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

/* Buttons */
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  transition: background var(--transition), box-shadow var(--transition);
  color: var(--text);
}

button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.btn-surface {
  background: var(--surface-hover);
  border: 1px solid var(--border);
}
.btn-surface:hover { background: var(--surface-active); }

.btn-accent {
  background: var(--accent);
}
.btn-accent:hover { background: var(--accent-hover); }

.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
}
.btn-danger:hover { background: var(--danger); color: white; }

.btn-sm {
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
}

/* Board sections */
.boards-container {
  padding: 1rem 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
  padding-bottom: 4rem;
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
}

.board-section {
  flex: 1 1 400px;
  min-width: 300px;
  max-width: 100%;
}

.board-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.board-name {
  font-size: 1.1rem;
  font-weight: 600;
}

.board-name-input {
  font-size: 1.1rem;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--focus);
  border-radius: 4px;
  color: var(--text);
  padding: 0.125rem 0.375rem;
  outline: none;
}

.board-addr {
  font-size: 0.8125rem;
  color: var(--text-dim);
  font-family: 'SF Mono', 'Fira Code', monospace;
  cursor: default;
}
body.edit-mode .board-addr { cursor: pointer; }

.board-settings-inline {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  font-size: 0.8125rem;
}

.board-settings-inline label {
  color: var(--text-dim);
  font-size: 0.75rem;
}

.board-settings-inline input,
.board-settings-inline select {
  background: var(--bg);
  border: 1px solid var(--focus);
  border-radius: 4px;
  color: var(--text);
  padding: 0.2rem 0.375rem;
  font-size: 0.8125rem;
  font-family: 'SF Mono', 'Fira Code', monospace;
  outline: none;
  width: 4.5rem;
}

.board-settings-inline select {
  width: auto;
  font-family: inherit;
}

.board-settings-inline .btn-sm {
  padding: 0.25rem 0.5rem;
}

.board-error {
  color: var(--danger);
  font-size: 0.8125rem;
  margin-left: auto;
}

.board-actions {
  margin-left: auto;
  display: flex;
  gap: 0.375rem;
}

/* Relay grid - default auto-fill */
.relay-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.625rem;
}

/* Board physical layout */
.relay-board-view {
  display: inline-block;
}

.board-outline {
  display: grid;
  gap: 0.375rem;
  padding: 1rem;
  border: 2px solid #2d3a2d;
  border-radius: 12px;
  background: #111814;
  position: relative;
}

.board-outline::before {
  content: attr(data-label);
  position: absolute;
  top: -0.6rem;
  left: 1rem;
  background: #111814;
  padding: 0 0.375rem;
  font-size: 0.625rem;
  color: #4a6a4a;
  font-family: 'SF Mono', 'Fira Code', monospace;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* 16-channel: 2 cols x 8 rows */
.board-outline.board-16 {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(8, auto);
  width: min(400px, 100%);
}

/* 8-channel: 1 col x 8 rows */
.board-outline.board-8 {
  grid-template-columns: 1fr;
  grid-template-rows: repeat(8, auto);
  width: min(200px, 100%);
}

/* 4-channel: 1 col x 4 rows */
.board-outline.board-4 {
  grid-template-columns: 1fr;
  grid-template-rows: repeat(4, auto);
  width: min(200px, 100%);
}

/* 2-channel: 1 col x 2 rows */
.board-outline.board-2 {
  grid-template-columns: 1fr;
  grid-template-rows: repeat(2, auto);
  width: min(200px, 100%);
}

/* 1-channel: single */
.board-outline.board-1 {
  grid-template-columns: 1fr;
  width: min(200px, 100%);
}

/* Compact card for board view */
.board-outline .relay-card {
  padding: 0.5rem 0.625rem;
  min-height: 44px;
  gap: 0.25rem;
}

.board-outline .relay-name {
  font-size: 0.75rem;
}

.board-outline .relay-state {
  display: none;
}

.board-outline .relay-num {
  font-size: 0.625rem;
}

.board-outline .relay-indicator {
  width: 8px;
  height: 8px;
}

/* Layout toggle button */
.btn-layout {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  padding: 0.25rem 0.5rem;
  font-size: 0.6875rem;
  font-family: 'SF Mono', 'Fira Code', monospace;
  color: var(--text-dim);
}
.btn-layout:hover { background: var(--surface-active); color: var(--text); }
.btn-layout.active { border-color: #4a6a4a; color: #6a9a6a; }

/* Relay card */
.relay-card {
  background: var(--off-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.875rem;
  min-height: 80px;
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  user-select: none;
  position: relative;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.relay-card:hover {
  background: var(--surface-hover);
  border-color: #3a3a4a;
}

.relay-card:focus-visible {
  outline: none;
  border-color: var(--focus);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.relay-card.is-on {
  background: var(--surface);
  border-color: var(--on);
  box-shadow: 0 0 12px var(--on-glow);
}

.relay-card.is-on:focus-visible {
  border-color: var(--focus);
  box-shadow: 0 0 12px var(--on-glow), 0 0 0 3px var(--focus-ring);
}

.relay-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.relay-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--off);
  transition: background var(--transition), box-shadow var(--transition);
}

.relay-card.is-on .relay-indicator {
  background: var(--on);
  box-shadow: 0 0 8px var(--on);
}

.relay-num {
  font-size: 0.6875rem;
  color: var(--text-muted);
  font-family: 'SF Mono', 'Fira Code', monospace;
}

.relay-name {
  font-size: 0.875rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.relay-name-input {
  font-size: 0.875rem;
  font-weight: 500;
  background: var(--bg);
  border: 1px solid var(--focus);
  border-radius: 4px;
  color: var(--text);
  padding: 0.125rem 0.25rem;
  width: 100%;
  outline: none;
}

.relay-state {
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 600;
}

.relay-card.is-on .relay-state {
  color: var(--on);
}

/* --- PWM / LED dimming --- */
.pwm-card {
  cursor: default;
  gap: 0.375rem;
}

.pwm-level {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.6875rem;
  font-family: 'SF Mono', 'Fira Code', monospace;
  color: var(--text-muted);
}

.pwm-card.is-on .pwm-level { color: var(--on); }

.pwm-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  margin: 0.25rem 0 0;
  border-radius: 2px;
  background: var(--surface-active);
  outline: none;
  cursor: pointer;
  touch-action: none;
}

.pwm-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--off);
  border: 2px solid var(--bg);
  cursor: pointer;
}

.pwm-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--off);
  border: 2px solid var(--bg);
  cursor: pointer;
}

.pwm-card.is-on .pwm-slider::-webkit-slider-thumb { background: var(--on); }
.pwm-card.is-on .pwm-slider::-moz-range-thumb { background: var(--on); }

.pwm-slider:focus-visible { box-shadow: 0 0 0 3px var(--focus-ring); }

/* Group masters read as controls over the channels, not peers of them */
.pwm-group-card { border-color: var(--accent); }

.pwm-group-card.is-on {
  border-color: var(--accent-hover);
  box-shadow: 0 0 12px rgba(92, 107, 192, 0.25);
}

.pwm-group-card.is-on .relay-indicator {
  background: var(--accent-hover);
  box-shadow: 0 0 8px var(--accent-hover);
}

.pwm-group-card.is-on .pwm-level { color: var(--accent-hover); }
.pwm-group-card.is-on .pwm-slider::-webkit-slider-thumb { background: var(--accent-hover); }
.pwm-group-card.is-on .pwm-slider::-moz-range-thumb { background: var(--accent-hover); }

.pwm-mixed {
  color: var(--accent-hover);
  font-size: 0.625rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.pwm-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem;
  margin-bottom: 0.75rem;
}

.pwm-picker label {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  margin: 0;
  padding: 0.3rem 0.5rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.8125rem;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}

.pwm-picker label:has(input:checked) {
  border-color: var(--accent);
  color: var(--text);
}

.pwm-picker input { margin: 0; cursor: pointer; }

.pwm-picker-empty {
  color: var(--text-muted);
  font-size: 0.8125rem;
  margin-bottom: 0.75rem;
}

.pwm-freq {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 0.25rem 0.35rem;
  cursor: pointer;
}

/* Keyboard hint */
.keyboard-hint {
  position: fixed;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.5rem 1rem;
  font-size: 0.75rem;
  color: var(--text-dim);
  display: flex;
  gap: 1rem;
  z-index: 10;
}

.keyboard-hint kbd {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0.1rem 0.375rem;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 0.6875rem;
  margin-right: 0.25rem;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  width: 90%;
  max-width: 420px;
}

.modal h2 {
  font-size: 1.1rem;
  margin-bottom: 1rem;
}

.modal label {
  display: block;
  font-size: 0.8125rem;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
  margin-top: 0.75rem;
}

.modal input, .modal select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 0.5rem 0.75rem;
  font-size: 0.875rem;
  font-family: inherit;
  outline: none;
}
.modal input:focus, .modal select:focus {
  border-color: var(--focus);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
  margin-top: 1.25rem;
}

/* Toast */
.toast-container {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.5rem 1rem;
  font-size: 0.8125rem;
  animation: fadeIn 200ms ease, fadeOut 200ms ease 2.3s forwards;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* Loading */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  color: var(--text-dim);
}

/* Edit button on card — hidden unless edit mode */
.relay-edit-btn {
  display: none;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  padding: 0.125rem 0.375rem;
  font-size: 0.625rem;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  margin-left: auto;
  margin-right: 0.375rem;
}

body.edit-mode .relay-edit-btn {
  display: block;
}

.relay-card:has(.relay-name-input) .relay-edit-btn {
  visibility: hidden;
}

/* GPIO card extras */
.gpio-card { position: relative; }

.gpio-card .relay-num {
  margin-left: auto;
}

.gpio-remove-btn,
.pwm-remove-btn {
  display: none;
  position: absolute;
  top: 4px;
  right: 4px;
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 4px;
  padding: 0 0.375rem;
  font-size: 0.75rem;
  line-height: 1.4;
  cursor: pointer;
  z-index: 1;
}
.gpio-remove-btn:hover,
.pwm-remove-btn:hover { background: var(--danger); color: white; }
body.edit-mode .gpio-remove-btn,
body.edit-mode .pwm-remove-btn { display: block; }

/* Structural controls inside a section: adding a channel or a group changes
   the rig's shape the same way removing one does, so both live behind Edit.
   The page-header + buttons stay out, they are the global toolbar. */
.edit-only { display: none; }
body.edit-mode .edit-only { display: block; }

.gpio-card:has(.relay-name-input) .gpio-remove-btn { visibility: hidden; }
.pwm-card:has(.relay-name-input) .pwm-remove-btn { visibility: hidden; }

/* USB device section */
.usb-section { flex-basis: 100%; }

.usb-card { cursor: default; }

.usb-card .relay-top { gap: 0.625rem; }

.usb-card .relay-indicator { flex-shrink: 0; }

.usb-card .relay-num {
  flex: 1;
  text-align: right;
}

.usb-card .usb-port { text-align: right; }

.usb-detail {
  font-size: 0.75rem;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.usb-detail.mono {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 0.6875rem;
}

/* Edit mode toggle */
.btn-edit-mode {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  padding: 0.375rem 0.75rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}
.btn-edit-mode:hover { background: var(--surface-active); }
.btn-edit-mode.active {
  border-color: var(--accent);
  color: var(--accent-hover);
}

/* Board name clickable cursor only in edit mode */
.board-name { cursor: default; }
body.edit-mode .board-name { cursor: pointer; }

/* Responsive - Tablet */
@media (max-width: 900px) {
  .relay-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}

/* Responsive - Mobile */
@media (max-width: 600px) {
  .header { padding: 0.75rem 1rem; }
  .header h1 { font-size: 1.1rem; }
  .boards-container { padding: 0.75rem 0.75rem; padding-bottom: 2rem; flex-direction: column; }
  .relay-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
  .relay-card { padding: 0.75rem; min-height: 72px; }
  .keyboard-hint { display: none; }

  .board-header {
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .board-actions {
    margin-left: 0;
    width: 100%;
    justify-content: flex-start;
  }
  .board-addr { font-size: 0.75rem; }

}

/* Responsive - Very small */
@media (max-width: 360px) {
  .relay-grid { grid-template-columns: 1fr 1fr; gap: 0.375rem; }
  .relay-card { padding: 0.625rem; min-height: 64px; }
  .relay-name { font-size: 0.8125rem; }
}

/* Touch device detection - show edit buttons */
@media (hover: none) and (pointer: coarse) {
  .relay-card { min-height: 80px; }
  .relay-card:active {
    background: var(--surface-active);
    transform: scale(0.97);
    transition: transform 50ms ease;
  }
  .relay-card.is-on:active {
    background: var(--surface-active);
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>Relay Control Panel <span class="poll-dot" id="pollDot" title="Polling indicator"></span></h1>
  <div class="header-actions">
    <button class="btn-edit-mode btn-sm" id="editModeBtn" onclick="toggleEditMode()" title="Toggle edit mode">Edit</button>
    <button class="btn-surface btn-sm" onclick="addBoardModal()" title="Add I2C board">+ Board</button>
    <button class="btn-surface btn-sm" onclick="addGpioModal()" title="Add GPIO pin">+ GPIO</button>
    <button class="btn-surface btn-sm" onclick="addPwmModal()" title="Add PCA9685 PWM chip">+ PWM</button>
  </div>
</div>

<div id="tokenBar" style="display:none;align-items:center;gap:.6rem;flex-wrap:wrap;
     margin:0 1rem 1rem;padding:.7rem .9rem;border-radius:8px;
     background:#3a2a12;border:1px solid #7a5a20;color:#f0d9a8;font-size:.9rem">
  <span id="tokenMsg">This network needs an access token to make changes.</span>
  <input id="tokenInput" type="password" placeholder="Access token" autocomplete="off"
         style="flex:1;min-width:12rem;padding:.4rem .6rem;border-radius:6px;
                border:1px solid #7a5a20;background:#241a0c;color:#f0d9a8">
  <button class="btn-surface btn-sm" onclick="saveToken()">Save</button>
  <button class="btn-surface btn-sm" onclick="clearToken()" title="Forget the stored token">Clear</button>
</div>

<div class="boards-container" id="boards"></div>

<div class="keyboard-hint">
  <span><kbd>Arrow</kbd> Navigate</span>
  <span><kbd>Enter</kbd> Toggle</span>
  <span><kbd>E</kbd> Edit mode</span>
  <span><kbd>A</kbd> All on</span>
  <span><kbd>Z</kbd> All off</span>
</div>

<div class="modal-overlay" id="addBoardModal">
  <div class="modal">
    <h2>Add Board</h2>
    <label for="boardName">Name</label>
    <input type="text" id="boardName" value="Board" placeholder="Board name">
    <label for="boardAddr">I2C Address</label>
    <input type="text" id="boardAddr" value="0x21" placeholder="0x20-0x27">
    <label for="boardBus">I2C Bus</label>

<script>
const boardsEl = document.getElementById('boards');
let state = { boards: [], gpios: [], pwm: [] };
let focusedBoard = 0;
let focusedRelay = 0;
let editing = false;
let editMode = false;
let pollTimer = null;
let sliding = false;   // a PWM slider is being dragged; hold off the re-render

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editModeBtn').classList.toggle('active', editMode);
  render();
}

// --- API ---
// Callers off the trusted network (a VPN guest, say) must present a token to
// change anything; the panel answers 403 otherwise. Held per browser, never
// sent anywhere but this panel.
let apiToken = '';
try { apiToken = localStorage.getItem('relay_panel_token') || ''; } catch (e) { apiToken = ''; }

function setApiToken(tok) {
  apiToken = (tok || '').trim();
  try {
    if (apiToken) localStorage.setItem('relay_panel_token', apiToken);
    else localStorage.removeItem('relay_panel_token');
  } catch (e) { /* private browsing - token lasts for this page only */ }
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (apiToken) opts.headers['Authorization'] = 'Bearer ' + apiToken;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 403) {
    showTokenPrompt(data && data.error === 'forbidden');
    return data;
  }
  return data;
}

// Shown when the panel refuses an action: either no token from an untrusted
// network, or a token that does not cover the thing being driven.
function showTokenPrompt(hasToken) {
  const el = document.getElementById('tokenBar');
  if (!el) return;
  el.style.display = 'flex';
  const msg = document.getElementById('tokenMsg');
  if (msg) {
    msg.textContent = apiToken
      ? 'That control is outside your token’s scope.'
      : 'This network needs an access token to make changes.';
  }
}

function saveToken() {
  const el = document.getElementById('tokenInput');
  setApiToken(el ? el.value : '');
  if (el) el.value = '';
  if (apiToken) {
    const bar = document.getElementById('tokenBar');
    if (bar) bar.style.display = 'none';
  }
  fetchState();
}

function clearToken() {
  setApiToken('');
  const msg = document.getElementById('tokenMsg');
  if (msg) msg.textContent = 'Token cleared.';
}

async function fetchState() {
  try {
    state = await api('GET', '/api/state');
    render();
  } catch (e) {
    boardsEl.innerHTML = '<div class="loading">Failed to connect to server</div>';
  }
}

async function toggleRelay(boardIdx, relayNum) {
  const data = await api('POST', '/api/relay/toggle', { board: boardIdx, relay: relayNum });
  // Update local state immediately
  const board = state.boards[boardIdx];
  if (board) {
    const relay = board.relays.find(r => r.num === relayNum);
    if (relay) relay.state = data.state;
    render();
  }
}

async function setAll(boardIdx, on) {
  await api('POST', '/api/board/all', { board: boardIdx, state: on });
  fetchState();
}

async function renameRelay(boardIdx, relayNum, name) {
  await api('PUT', '/api/relay/name', { board: boardIdx, relay: relayNum, name });
  const board = state.boards[boardIdx];
  if (board) {
    const relay = board.relays.find(r => r.num === relayNum);
    if (relay) relay.name = name;
  }
}

async function renameBoard(boardIdx, name) {
  await api('PUT', '/api/board/name', { board: boardIdx, name });
  const board = state.boards[boardIdx];
  if (board) board.name = name;
}

async function toggleLayout(boardIdx) {
  const board = state.boards[boardIdx];
  if (!board) return;
  const newLayout = board.layout === 'board' ? 'grid' : 'board';
  await api('PUT', '/api/board/layout', { board: boardIdx, layout: newLayout });
  board.layout = newLayout;
  render();
}

async function toggleFlip(boardIdx) {
  const data = await api('PUT', '/api/board/flip', { board: boardIdx });
  const board = state.boards[boardIdx];
  if (board) board.flipped = data.flipped;
  render();
}

// Returns relay indices in physical board display order
function boardDisplayOrder(size) {
  if (size === 16) {
    // 2 columns x 8 rows: left=8-15, right=0-7
    const order = [];
    for (let row = 0; row < 8; row++) {
      order.push(8 + row);  // left column
      order.push(row);      // right column
    }
    return order;
  }
  // For 1, 2, 4, 8: just sequential top to bottom
  return Array.from({ length: size }, (_, i) => i);
}

async function resetBoard(boardIdx) {
  const result = await api('POST', '/api/board/reset', { board: boardIdx });
  if (result.error) {
    toast('Reset failed: ' + result.error);
  } else {
    toast('Board reset - all OFF');
    fetchState();
  }
}

async function deleteBoard(boardIdx) {
  if (!confirm(`Delete ${state.boards[boardIdx]?.name || 'this board'}?`)) return;
  await api('DELETE', `/api/boards/${boardIdx}`);
  fetchState();
}

async function toggleGpio(wpi) {
  const data = await api('POST', '/api/gpio/toggle', { wpi });
  if (data.error) { toast(data.error); return; }
  const g = state.gpios.find(x => x.wpi === wpi);
  if (g) g.state = data.state;
  render();
}

async function setGpioState(wpi, on) {
  const data = await api('POST', '/api/gpio/set', { wpi, state: on });
  if (data.error) { toast(data.error); return; }
  const g = state.gpios.find(x => x.wpi === wpi);
  if (g) g.state = data.state;
  render();
}

async function renameGpio(wpi, name) {
  await api('PUT', '/api/gpio/name', { wpi, name });
  const g = state.gpios.find(x => x.wpi === wpi);
  if (g) g.name = name;
}

async function removeGpio(wpi) {
  const g = state.gpios.find(x => x.wpi === wpi);
  if (!confirm(`Remove GPIO ${g?.name || 'wPi ' + wpi}?`)) return;
  const data = await api('DELETE', `/api/gpios/${wpi}`);
  if (data.error) { toast(data.error); return; }
  toast(`Removed GPIO wPi ${wpi}`);
  fetchState();
}

async function addGpio() {
  const wpi = parseInt(document.getElementById('gpioWpi').value);
  if (isNaN(wpi)) { toast('wPi number required'); return; }
  const pinVal = document.getElementById('gpioPin').value;
  const pin = pinVal === '' ? null : parseInt(pinVal);
  const name = document.getElementById('gpioName').value || `GPIO ${wpi}`;
  const body = { wpi, name };
  if (pin !== null && !isNaN(pin)) body.pin = pin;
  const result = await api('POST', '/api/gpios', body);
  if (result.error) {
    toast(result.error);
  } else {
    closeGpioModal();
    fetchState();
    toast(`Added GPIO wPi ${wpi}`);
  }
}

async function addBoard() {
  const name = document.getElementById('boardName').value || 'Board';
  const address = document.getElementById('boardAddr').value || '0x21';
  const bus = parseInt(document.getElementById('boardBus').value) || 2;
  const size = parseInt(document.getElementById('boardSize').value) || 16;
  const result = await api('POST', '/api/boards', { name, address, bus, size });
  if (result.error) {
    toast(result.error);
  } else {
    closeModal();
    fetchState();
    toast(`Added board at ${address}`);
  }
}

// --- PWM (LED dimming) ---
const PWM_MAX = 4095;
const PWM_FREQS = [24, 50, 100, 200, 400, 800, 1526];

// Mirrors pca_prescale_for() on the server so the dropdown can mark the option
// that actually corresponds to the chip's current divider. Comparing achieved
// frequencies instead would need a tolerance, and the steps are uneven.
function pwmPrescaleFor(hz) {
  return Math.max(3, Math.min(255, Math.round(25e6 / (4096 * hz)) - 1));
}

// One request in flight per channel, latest value wins. Dragging a slider
// emits far more input events than the I2C write can absorb, and without this
// they arrive out of order and the strip settles on a stale level.
const pwmInflight = new Map();

async function pwmCoalesced(key, level, send) {
  if (pwmInflight.has(key)) { pwmInflight.set(key, level); return; }
  pwmInflight.set(key, level);
  while (pwmInflight.has(key)) {
    const v = pwmInflight.get(key);
    const data = await send(v);
    if (data && data.error) { toast(data.error); pwmInflight.delete(key); return; }
    if (pwmInflight.get(key) === v) pwmInflight.delete(key);
  }
}

// Repaint one channel card in place. The poll is held off during a drag, so a
// group master has to push its members' cards itself or they sit stale until
// the pointer comes up.
function paintPwmCard(chipIdx, ch, level) {
  const chip = (state.pwm || [])[chipIdx];
  const c = chip && chip.channels.find(x => x.ch === ch);
  if (c) { c.level = level; c.percent = Math.round(1000 * level / PWM_MAX) / 10; }
  const card = boardsEl.querySelector(`.pwm-card[data-pwm-chip="${chipIdx}"][data-pwm-ch="${ch}"]`);
  if (!card) return;
  const lv = card.querySelector('.pwm-level');
  if (lv) lv.innerHTML = `<span>${(100 * level / PWM_MAX).toFixed(1)}%</span><span>${level}</span>`;
  card.classList.toggle('is-on', level > 0);
  const s = card.querySelector('.pwm-slider');
  if (s && document.activeElement !== s) s.value = level;
}

async function pwmSend(chipIdx, ch, level) {
  return pwmCoalesced(`ch:${chipIdx}:${ch}`, level, async (v) => {
    const data = await api('POST', '/api/pwm/set', { chip: chipIdx, channel: ch, level: v });
    if (data && !data.error) {
      const chip = (state.pwm || [])[chipIdx];
      const c = chip && chip.channels.find(x => x.ch === ch);
      if (c) { c.level = data.level; c.percent = data.percent; }
    }
    return data;
  });
}

async function pwmSendGroup(chipIdx, gi, level) {
  return pwmCoalesced(`g:${chipIdx}:${gi}`, level, async (v) => {
    const data = await api('POST', '/api/pwm/group', { chip: chipIdx, group: gi, level: v });
    if (data && !data.error) {
      const chip = (state.pwm || [])[chipIdx];
      const g = chip && (chip.groups || []).find(x => x.index === gi);
      if (g) { g.level = data.level; g.percent = data.percent; g.mixed = false; }
      for (const [ch, lvl] of Object.entries(data.channels || {})) {
        paintPwmCard(chipIdx, parseInt(ch), lvl);
      }
    }
    return data;
  });
}

async function pwmSetAll(chipIdx, level) {
  const data = await api('POST', '/api/pwm/all', { chip: chipIdx, level });
  if (data && data.error) { toast(data.error); return; }
  await fetchState();
}

async function setPwmFreq(chipIdx, hz) {
  const data = await api('PUT', '/api/pwm/freq', { chip: chipIdx, freq_hz: hz });
  if (data && data.error) { toast(data.error); return; }
  await fetchState();
  toast(`${data.freq_hz} Hz (PRE_SCALE ${data.prescale})`);
}

async function renamePwmChannel(chipIdx, ch, name) {
  await api('PUT', '/api/pwm/name', { chip: chipIdx, channel: ch, name });
  await fetchState();
}

function startEditPwmName(chipIdx, ch) {
  editing = true;
  const chip = (state.pwm || [])[chipIdx];
  const c = chip && chip.channels.find(x => x.ch === ch);
  if (!c) { editing = false; return; }
  const card = boardsEl.querySelector(`.pwm-card[data-pwm-chip="${chipIdx}"][data-pwm-ch="${ch}"]`);
  if (!card) { editing = false; return; }
  const nameEl = card.querySelector('.relay-name');
  const current = c.name;
  nameEl.innerHTML = `<input class="relay-name-input" type="text" value="${escAttr(current)}">`;
  const input = nameEl.querySelector('input');
  input.focus();
  input.select();

  const finish = async (save) => {
    editing = false;
    if (save && input.value !== current) {
      await renamePwmChannel(chipIdx, ch, input.value);
    }
    render();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
  input.addEventListener('blur', () => finish(true));
}

// --- PWM chips: add / remove / re-address ---
function addPwmModal() {
  document.getElementById('addPwmModal').classList.add('open');
  document.getElementById('pwmName').focus();
}

function closePwmModal() {
  document.getElementById('addPwmModal').classList.remove('open');
}

async function addPwmChip() {
  const body = {
    name: document.getElementById('pwmName').value || 'LED PWM',
    address: document.getElementById('pwmAddr').value || '0x40',
    bus: parseInt(document.getElementById('pwmBus').value) || 2,
    size: parseInt(document.getElementById('pwmSize').value) || 4,
  };
  const r = await api('POST', '/api/pwm', body);
  if (r.error) { toast(r.error); return; }
  closePwmModal();
  await fetchState();
  toast(`Added PWM chip at ${body.address}`);
}

async function deletePwmChip(chipIdx) {
  const chip = (state.pwm || [])[chipIdx];
  if (!confirm(`Remove PWM chip "${chip ? chip.name : chipIdx}"? Its channels go dark.`)) return;
  const r = await api('DELETE', `/api/pwm/${chipIdx}`);
  if (r.error) { toast(r.error); return; }
  await fetchState();
  toast('PWM chip removed');
}

function startEditPwmSettings(chipIdx) {
  editing = true;
  const chip = (state.pwm || [])[chipIdx];
  if (!chip) { editing = false; return; }
  const addrEl = boardsEl.querySelector(`.pwm-section[data-pwm-idx="${chipIdx}"] .board-addr`);
  if (!addrEl) { editing = false; return; }

  const curAddr = chip.address;
  const curBus = chip.bus;

  addrEl.outerHTML = `<div class="board-settings-inline" data-pwm-idx="${chipIdx}">
    <label>addr</label>
    <input type="text" id="pwmSettAddr${chipIdx}" value="${escAttr(curAddr)}" style="width:4rem">
    <label>bus</label>
    <input type="number" id="pwmSettBus${chipIdx}" value="${curBus}" min="0" max="10" style="width:3rem">
    <button class="btn-accent btn-sm" id="pwmSettSave${chipIdx}">Save</button>
    <button class="btn-surface btn-sm" id="pwmSettCancel${chipIdx}">Cancel</button>
  </div>`;

  const box = boardsEl.querySelector(`.board-settings-inline[data-pwm-idx="${chipIdx}"]`);
  box.querySelector(`#pwmSettAddr${chipIdx}`).focus();

  const finish = async (save) => {
    editing = false;
    if (save) {
      const addr = box.querySelector(`#pwmSettAddr${chipIdx}`).value || curAddr;
      const bus = parseInt(box.querySelector(`#pwmSettBus${chipIdx}`).value);
      if (addr !== curAddr || bus !== curBus) {
        const r = await api('PUT', '/api/pwm/settings', {
          chip: chipIdx, address: addr, bus: isNaN(bus) ? curBus : bus,
        });
        if (r.error) { toast(r.error); }
        else { toast(`Now at ${r.address} bus:${r.bus}`); }
        await fetchState();
        return;
      }
    }
    render();
  };

  box.querySelector(`#pwmSettSave${chipIdx}`).addEventListener('click', (e) => {
    e.stopPropagation(); finish(true);
  });
  box.querySelector(`#pwmSettCancel${chipIdx}`).addEventListener('click', (e) => {
    e.stopPropagation(); finish(false);
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
}

function startEditPwmChipName(chipIdx) {
  editing = true;
  const chip = (state.pwm || [])[chipIdx];
  if (!chip) { editing = false; return; }
  const nameEl = boardsEl.querySelector(`.pwm-section[data-pwm-idx="${chipIdx}"] .board-name`);
  if (!nameEl) { editing = false; return; }
  const current = chip.name;
  nameEl.outerHTML = `<input class="board-name-input" type="text" value="${escAttr(current)}">`;
  const input = boardsEl.querySelector(`.pwm-section[data-pwm-idx="${chipIdx}"] .board-name-input`);
  input.focus();
  input.select();

  const finish = async (save) => {
    editing = false;
    if (save && input.value !== current) {
      await api('PUT', '/api/pwm/name', { chip: chipIdx, name: input.value });
      await fetchState();
      return;
    }
    render();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
  input.addEventListener('blur', () => finish(true));
}

// --- PWM channels: add / remove ---
let pwmChannelTarget = null;

function addPwmChannelModal(chipIdx) {
  const chip = (state.pwm || [])[chipIdx];
  if (!chip) return;
  const free = chip.available || [];
  if (!free.length) { toast('All 16 channels are already configured'); return; }
  pwmChannelTarget = chipIdx;
  const sel = document.getElementById('pwmChSel');
  sel.innerHTML = free.map(c => `<option value="${c}">Channel ${c}</option>`).join('');
  document.getElementById('pwmChName').value = '';
  document.getElementById('addPwmChannelModal').classList.add('open');
  sel.focus();
}

function closePwmChannelModal() {
  document.getElementById('addPwmChannelModal').classList.remove('open');
  pwmChannelTarget = null;
}

async function addPwmChannel() {
  if (pwmChannelTarget == null) return;
  const ch = parseInt(document.getElementById('pwmChSel').value);
  const name = document.getElementById('pwmChName').value;
  const r = await api('POST', '/api/pwm/channels', {
    chip: pwmChannelTarget, channel: ch, name: name || undefined,
  });
  if (r.error) { toast(r.error); return; }
  closePwmChannelModal();
  await fetchState();
  toast(`Added channel ${ch}`);
}

async function removePwmChannel(chipIdx, ch) {
  const chip = (state.pwm || [])[chipIdx];
  const c = chip && chip.channels.find(x => x.ch === ch);
  if (!confirm(`Remove channel ${ch}${c ? ` (${c.name})` : ''}? It goes dark and drops out of any group.`)) return;
  const r = await api('DELETE', `/api/pwm/channels/${chipIdx}/${ch}`);
  if (r.error) { toast(r.error); return; }
  await fetchState();
  const dropped = (r.groups_dropped || []).filter(Boolean);
  toast(dropped.length
    ? `Channel ${ch} removed; group${dropped.length > 1 ? 's' : ''} ${dropped.join(', ')} left empty and removed`
    : `Channel ${ch} removed`);
}

// --- PWM groups: add / edit membership / remove ---
let pwmGroupTarget = null;   // {chip, gi} - gi null when adding

function pwmGroupModal(chipIdx, gi) {
  const chip = (state.pwm || [])[chipIdx];
  if (!chip) return;
  if (!chip.channels.length) { toast('Add a channel first'); return; }
  const g = gi == null ? null : (chip.groups || []).find(x => x.index === gi);
  pwmGroupTarget = { chip: chipIdx, gi: g ? gi : null };

  document.getElementById('pwmGroupTitle').textContent = g ? 'Edit Group' : 'Add Group';
  document.getElementById('pwmGroupName').value = g ? g.name : '';
  const picked = new Set(g ? g.channels : []);
  document.getElementById('pwmGroupPicker').innerHTML = chip.channels.map(c =>
    `<label><input type="checkbox" value="${c.ch}"${picked.has(c.ch) ? ' checked' : ''}>
       ${c.ch} ${escHtml(c.name)}</label>`
  ).join('');
  document.getElementById('pwmGroupModal').classList.add('open');
  document.getElementById('pwmGroupName').focus();
}

function closePwmGroupModal() {
  document.getElementById('pwmGroupModal').classList.remove('open');
  pwmGroupTarget = null;
}

async function savePwmGroup() {
  if (!pwmGroupTarget) return;
  const { chip, gi } = pwmGroupTarget;
  const name = document.getElementById('pwmGroupName').value || 'Group';
  const channels = [...document.getElementById('pwmGroupPicker')
    .querySelectorAll('input:checked')].map(i => parseInt(i.value));
  if (!channels.length) { toast('Pick at least one channel'); return; }
  const r = gi == null
    ? await api('POST', '/api/pwm/groups', { chip, name, channels })
    : await api('PUT', '/api/pwm/group', { chip, group: gi, name, channels });
  if (r.error) { toast(r.error); return; }
  closePwmGroupModal();
  await fetchState();
  toast(gi == null ? `Added group "${name}"` : `Updated "${name}"`);
}

async function removePwmGroup(chipIdx, gi) {
  const chip = (state.pwm || [])[chipIdx];
  const g = chip && (chip.groups || []).find(x => x.index === gi);
  if (!confirm(`Remove group "${g ? g.name : gi}"? Its channels stay as they are.`)) return;
  const r = await api('DELETE', `/api/pwm/groups/${chipIdx}/${gi}`);
  if (r.error) { toast(r.error); return; }
  await fetchState();
  toast('Group removed');
}

// --- Rendering ---
function renderPwmSection() {
  const chips = state.pwm || [];
  if (chips.length === 0) return '';

  return chips.map(chip => {
    const groupCards = (chip.groups || []).map(g => {
      const on = g.level > 0;
      const members = g.channels.length ? `ch ${g.channels.join('·')}` : 'no members';
      const mixed = g.mixed ? '<span class="pwm-mixed" title="a member is off its weighted ratio">mixed</span>' : '';
      return `<div class="relay-card pwm-card pwm-group-card ${on ? 'is-on' : ''}"
                   data-pwm-chip="${chip.index}" data-pwm-group="${g.index}">
        <button class="pwm-remove-btn" data-remove-group-chip="${chip.index}" data-remove-group-gi="${g.index}" title="Remove this group">×</button>
        <div class="relay-top">
          <div class="relay-indicator"></div>
          <button class="relay-edit-btn" data-edit-group-chip="${chip.index}" data-edit-group-gi="${g.index}" title="Edit name and members">edit</button>
          <span class="relay-num">${members}</span>
        </div>
        <div class="relay-name">${escHtml(g.name)}</div>
        <div class="pwm-level"><span>${g.percent.toFixed(1)}%</span>${mixed}<span>${g.level}</span></div>
        <input class="pwm-slider" type="range" min="0" max="${PWM_MAX}" step="1" value="${g.level}"
               data-pwm-chip="${chip.index}" data-pwm-group="${g.index}"
               aria-label="${escAttr(g.name)} master level">
      </div>`;
    }).join('');

    const cards = groupCards + chip.channels.map(c => {
      const on = c.level > 0;
      return `<div class="relay-card pwm-card ${on ? 'is-on' : ''}"
                   data-pwm-chip="${chip.index}" data-pwm-ch="${c.ch}">
        <button class="pwm-remove-btn" data-remove-ch-chip="${chip.index}" data-remove-ch="${c.ch}" title="Remove this channel">×</button>
        <div class="relay-top">
          <div class="relay-indicator"></div>
          <button class="relay-edit-btn" data-edit-pwm="${chip.index}" data-edit-pwm-ch="${c.ch}" title="Edit name">edit</button>
          <span class="relay-num">#${c.ch} · &phi;${c.phase}</span>
        </div>
        <div class="relay-name">${escHtml(c.name)}</div>
        <div class="pwm-level"><span>${c.percent.toFixed(1)}%</span><span>${c.level}</span></div>
        <input class="pwm-slider" type="range" min="0" max="${PWM_MAX}" step="1" value="${c.level}"
               data-pwm-chip="${chip.index}" data-pwm-ch="${c.ch}"
               aria-label="${escAttr(c.name)} level">
      </div>`;
    }).join('');

    const opts = PWM_FREQS.map(f => {
      const sel = pwmPrescaleFor(f) === chip.prescale ? ' selected' : '';
      return `<option value="${f}"${sel}>${f} Hz</option>`;
    }).join('');

    const empty = '<div class="loading" style="min-height:80px;font-size:0.875rem">No channels configured — turn on Edit, then + Ch</div>';

    return `<div class="board-section pwm-section" data-pwm-idx="${chip.index}">
      <div class="board-header">
        <span class="board-name" data-pwm-idx="${chip.index}" title="Click to rename in edit mode">${escHtml(chip.name)}</span>
        <span class="board-addr" data-pwm-idx="${chip.index}" title="Click to edit in edit mode">${chip.address} bus:${chip.bus} · ${chip.freq_hz} Hz (PRE_SCALE ${chip.prescale})</span>
        ${chip.error ? `<span class="board-error">${escHtml(chip.error)}</span>` : ''}
        <div class="board-actions">
          <select class="pwm-freq" data-pwm-freq="${chip.index}" title="PWM frequency (applies to all 16 channels)">${opts}</select>
          <button class="btn-surface btn-sm edit-only" data-pwm-addch="${chip.index}" title="Add a channel"${(chip.available || []).length ? '' : ' disabled'}>+ Ch</button>
          <button class="btn-surface btn-sm edit-only" data-pwm-addgroup="${chip.index}" title="Drive several channels from one master">+ Group</button>
          <button class="btn-surface btn-sm" data-pwm-all="${chip.index}" data-pwm-level="${PWM_MAX}">All On</button>
          <button class="btn-surface btn-sm" data-pwm-all="${chip.index}" data-pwm-level="0">All Off</button>
          ${editMode ? `<button class="btn-danger btn-sm" data-pwm-remove="${chip.index}">Remove</button>` : ''}
        </div>
      </div>
      ${cards ? `<div class="relay-grid">${cards}</div>` : empty}
    </div>`;
  }).join('');
}

function renderGpiosSection() {
  const gpios = state.gpios || [];
  if (gpios.length === 0 && !editMode) return '';

  const cards = gpios.map(g => {
    const onClass = g.state === 'on' ? 'is-on' : '';
    const stateText = g.state === 'on' ? 'ON' : 'OFF';
    const numLabel = g.pin != null ? `wPi ${g.wpi} · p${g.pin}` : `wPi ${g.wpi}`;
    const err = g.error ? `<div class="board-error">${escHtml(g.error)}</div>` : '';
    return `<div class="relay-card gpio-card ${onClass}"
                 data-gpio-wpi="${g.wpi}"
                 role="button"
                 aria-label="${escAttr(g.name)} - ${stateText}"
                 aria-pressed="${g.state === 'on'}">
      <button class="gpio-remove-btn" data-remove-gpio="${g.wpi}" title="Remove this GPIO">×</button>
      <div class="relay-top">
        <div class="relay-indicator"></div>
        <button class="relay-edit-btn" data-edit-gpio="${g.wpi}" title="Edit name">edit</button>
        <span class="relay-num">${numLabel}</span>
      </div>
      <div class="relay-name">${escHtml(g.name)}</div>
      <div class="relay-state">${stateText}</div>
      ${err}
    </div>`;
  }).join('');

  const empty = gpios.length === 0
    ? '<div class="loading" style="min-height:80px;font-size:0.875rem">No GPIOs configured — click + GPIO to add one</div>'
    : '';

  return `<div class="board-section gpios-section" data-gpios>
    <div class="board-header">
      <span class="board-name">GPIOs</span>
      <span class="board-addr">wiringOP · ${gpios.length} pin${gpios.length === 1 ? '' : 's'}</span>
      <div class="board-actions">
        <button class="btn-surface btn-sm edit-only" onclick="addGpioModal()">+ GPIO</button>
      </div>
    </div>
    ${cards ? `<div class="relay-grid">${cards}</div>` : empty}
  </div>`;
}

function renderUsbSection() {
  const devs = state.usb || [];
  const cards = devs.map(d => {
    const pidLabel = `${d.vid}:${d.pid || '????'}`;
    const sn = d.serial || '(none)';
    // shrink long serials to fit the card instead of ellipsizing (11px = the normal 0.6875rem)
    const snPx = Math.max(7, Math.min(11, Math.floor(150 / ((sn.length + 4) * 0.62))));
    const snStyle = snPx < 11 ? ` style="font-size:${snPx}px"` : '';
    return `<div class="relay-card usb-card is-on">
      <div class="relay-top">
        <div class="relay-indicator"></div>
        <span class="relay-num">${escHtml(pidLabel)}</span>
      </div>
      <div class="usb-detail mono usb-port">port ${escHtml(d.port)}</div>
      <div class="relay-name" title="${escAttr(d.product || '')}">${escHtml(d.product || '(no product string)')}</div>
      <div class="usb-detail">${escHtml(d.manufacturer || '(no manufacturer string)')}</div>
      <div class="usb-detail mono" title="S/N ${escAttr(sn)}"${snStyle}>S/N ${escHtml(sn)}</div>
    </div>`;
  }).join('');
  const vid = state.usb_vid || 'a108';
  const empty = `<div class="loading" style="min-height:60px;font-size:0.875rem">No ${escHtml(vid)} devices connected</div>`;
  return `<div class="board-section usb-section">
    <div class="board-header">
      <span class="board-name">USB Boot Devices</span>
      <span class="board-addr">idVendor ${escHtml(vid)} · ${devs.length} connected</span>
    </div>
    ${devs.length ? `<div class="relay-grid">${cards}</div>` : empty}
  </div>`;
}

function render() {
  const noBoards = !state.boards || state.boards.length === 0;
  const noGpios = !state.gpios || state.gpios.length === 0;
  const noPwm = !state.pwm || state.pwm.length === 0;
  if (noBoards && noGpios && noPwm) {
    boardsEl.innerHTML = '<div class="loading">No boards, GPIOs or PWM configured</div>' + renderUsbSection();
    return;
  }

  const boardsHtml = (state.boards || []).map((board, bi) => {
    const isBoardView = board.layout === 'board';
    const layoutBtnClass = isBoardView ? 'btn-layout active' : 'btn-layout';
    const layoutBtnText = isBoardView ? 'PCB' : 'Grid';
    const flipBtnClass = board.flipped ? 'btn-layout active' : 'btn-layout';

    // Build relay cards - in board view, reorder to match physical layout
    let displayOrder = isBoardView ? boardDisplayOrder(board.size) : board.relays.map(r => r.num);
    if (board.flipped) displayOrder = [...displayOrder].reverse();

    const relayCards = displayOrder.map(relayNum => {
      const ri = board.relays.findIndex(r => r.num === relayNum);
      const relay = board.relays[ri];
      if (!relay) return '';
      const onClass = relay.state === 'on' ? 'is-on' : '';
      const stateText = relay.state === 'on' ? 'ON' : 'OFF';
      const focused = (bi === focusedBoard && ri === focusedRelay);
      return `<div class="relay-card ${onClass}"
                   tabindex="${focused ? '0' : '-1'}"
                   data-board="${bi}" data-relay="${relay.num}" data-ri="${ri}"
                   role="button"
                   aria-label="${relay.name} - ${stateText}"
                   aria-pressed="${relay.state === 'on'}">
        <div class="relay-top">
          <div class="relay-indicator"></div>
          <button class="relay-edit-btn" data-edit-board="${bi}" data-edit-ri="${ri}" title="Edit name">edit</button>
          <span class="relay-num">#${relay.num}</span>
        </div>
        <div class="relay-name">${escHtml(relay.name)}</div>
        <div class="relay-state">${stateText}</div>
      </div>`;
    }).join('');

    let relayContainer;
    if (isBoardView) {
      relayContainer = `<div class="relay-board-view">
        <div class="board-outline board-${board.size}" data-label="${board.size}ch ${board.address}">
          ${relayCards}
        </div>
      </div>`;
    } else {
      relayContainer = `<div class="relay-grid">${relayCards}</div>`;
    }

    return `<div class="board-section" data-board-idx="${bi}">
      <div class="board-header">
        <span class="board-name" data-board-idx="${bi}" title="Click to rename">${escHtml(board.name)}</span>
        <span class="board-addr" data-board-idx="${bi}" title="Click to edit in edit mode">${board.address} bus:${board.bus} (${board.size}ch)</span>
        ${board.error ? `<span class="board-error">${escHtml(board.error)}</span>` : ''}
        <div class="board-actions">
          <button class="${layoutBtnClass} btn-sm" onclick="toggleLayout(${bi})" title="Toggle layout">${layoutBtnText}</button>
          <button class="${flipBtnClass} btn-sm" onclick="toggleFlip(${bi})" title="Flip relay order">Flip</button>
          <button class="btn-surface btn-sm" onclick="setAll(${bi}, true)">All On</button>
          <button class="btn-surface btn-sm" onclick="setAll(${bi}, false)">All Off</button>
          <button class="btn-surface btn-sm" onclick="resetBoard(${bi})" title="Re-init I2C and set all OFF">Reset</button>
          ${editMode && state.boards.length > 1 ? `<button class="btn-danger btn-sm" onclick="deleteBoard(${bi})">Remove</button>` : ''}
        </div>
      </div>
      ${relayContainer}
    </div>`;
  }).join('');

  boardsEl.innerHTML = boardsHtml + renderGpiosSection() + renderPwmSection() + renderUsbSection();

  // Restore focus
  const focusedCard = boardsEl.querySelector(`.relay-card[data-board="${focusedBoard}"][data-ri="${focusedRelay}"]`);
  if (focusedCard && document.activeElement?.classList?.contains('relay-card')) {
    focusedCard.focus();
  }
}

// --- Events ---
boardsEl.addEventListener('click', (e) => {
  // Ignore clicks on inputs (active inline editing)
  if (e.target.tagName === 'INPUT') return;

  // USB device cards are read-only
  if (e.target.closest('.usb-card')) return;

  // PWM header buttons
  const pwmAllBtn = e.target.closest('[data-pwm-all]');
  if (pwmAllBtn) {
    pwmSetAll(parseInt(pwmAllBtn.dataset.pwmAll), parseInt(pwmAllBtn.dataset.pwmLevel));
    return;
  }
  const pwmAddCh = e.target.closest('[data-pwm-addch]');
  if (pwmAddCh) { addPwmChannelModal(parseInt(pwmAddCh.dataset.pwmAddch)); return; }

  const pwmAddGroup = e.target.closest('[data-pwm-addgroup]');
  if (pwmAddGroup) { pwmGroupModal(parseInt(pwmAddGroup.dataset.pwmAddgroup), null); return; }

  const pwmRemove = e.target.closest('[data-pwm-remove]');
  if (pwmRemove) { deletePwmChip(parseInt(pwmRemove.dataset.pwmRemove)); return; }

  // PWM card × buttons (edit mode only, per the shared .pwm-remove-btn rule)
  const chRemove = e.target.closest('[data-remove-ch]');
  if (chRemove) {
    e.stopPropagation();
    removePwmChannel(parseInt(chRemove.dataset.removeChChip), parseInt(chRemove.dataset.removeCh));
    return;
  }
  const grpRemove = e.target.closest('[data-remove-group-gi]');
  if (grpRemove) {
    e.stopPropagation();
    removePwmGroup(parseInt(grpRemove.dataset.removeGroupChip), parseInt(grpRemove.dataset.removeGroupGi));
    return;
  }

  // GPIO remove button
  const gpioRemoveBtn = e.target.closest('.gpio-remove-btn');
  if (gpioRemoveBtn) {
    e.stopPropagation();
    removeGpio(parseInt(gpioRemoveBtn.dataset.removeGpio));
    return;
  }

  // Edit button on card
  const editBtn = e.target.closest('.relay-edit-btn');
  if (editBtn) {
    e.stopPropagation();
    if (editBtn.dataset.editGroupChip != null) {
      pwmGroupModal(parseInt(editBtn.dataset.editGroupChip), parseInt(editBtn.dataset.editGroupGi));
    } else if (editBtn.dataset.editPwm != null) {
      startEditPwmName(parseInt(editBtn.dataset.editPwm), parseInt(editBtn.dataset.editPwmCh));
    } else if (editBtn.dataset.editGpio != null) {
      startEditGpioName(parseInt(editBtn.dataset.editGpio));
    } else {
      const bi = parseInt(editBtn.dataset.editBoard);
      const ri = parseInt(editBtn.dataset.editRi);
      startEditRelayName(bi, ri);
    }
    return;
  }

  // GPIO card click
  const gpioCard = e.target.closest('.gpio-card');
  if (gpioCard) {
    const wpi = parseInt(gpioCard.dataset.gpioWpi);
    if (editMode) {
      if (!editing) startEditGpioName(wpi);
    } else {
      toggleGpio(wpi);
    }
    return;
  }

  // PWM cards carry .relay-card for styling but are driven by their slider,
  // not by clicking the card - fall through here or the relay branch below
  // reads a NaN board index off them.
  if (e.target.closest('.pwm-card')) return;

  const card = e.target.closest('.relay-card');
  if (card) {
    const bi = parseInt(card.dataset.board);
    focusedBoard = bi;
    focusedRelay = parseInt(card.dataset.ri);
    if (editMode) {
      if (!editing) startEditRelayName(bi, focusedRelay);
    } else {
      const relay = parseInt(card.dataset.relay);
      toggleRelay(bi, relay);
    }
    return;
  }

  const boardName = e.target.closest('.board-name');
  if (boardName && editMode) {
    if (boardName.dataset.pwmIdx != null) startEditPwmChipName(parseInt(boardName.dataset.pwmIdx));
    else startEditBoardName(parseInt(boardName.dataset.boardIdx));
    return;
  }

  const boardAddr = e.target.closest('.board-addr');
  if (boardAddr && editMode) {
    if (boardAddr.dataset.pwmIdx != null) startEditPwmSettings(parseInt(boardAddr.dataset.pwmIdx));
    else startEditBoardSettings(parseInt(boardAddr.dataset.boardIdx));
  }
});

// Double-click on relay card to edit name (only in edit mode)
boardsEl.addEventListener('dblclick', (e) => {
  if (!editMode) return;
  const card = e.target.closest('.relay-card');
  if (card) {
    e.preventDefault();
    const bi = parseInt(card.dataset.board);
    const ri = parseInt(card.dataset.ri);
    startEditRelayName(bi, ri);
  }
});

// PWM sliders: paint the readout locally on every input event and let pwmSend
// coalesce the writes. The 1 Hz poll rewrites boardsEl wholesale, which would
// tear the slider out from under the drag, so `sliding` holds it off until the
// pointer is released.
boardsEl.addEventListener('input', (e) => {
  const s = e.target.closest('.pwm-slider');
  if (!s) return;
  sliding = true;
  const level = parseInt(s.value);
  const card = s.closest('.pwm-card');
  if (card) {
    // dragging a master re-imposes the weighted ratio, so the mixed badge goes
    const lv = card.querySelector('.pwm-level');
    if (lv) lv.innerHTML = `<span>${(100 * level / PWM_MAX).toFixed(1)}%</span><span>${level}</span>`;
    card.classList.toggle('is-on', level > 0);
  }
  pwmSliderSend(s, level);
});

// A group slider carries data-pwm-group, a channel slider data-pwm-ch
function pwmSliderSend(s, level) {
  const chipIdx = parseInt(s.dataset.pwmChip);
  return s.dataset.pwmGroup != null
    ? pwmSendGroup(chipIdx, parseInt(s.dataset.pwmGroup), level)
    : pwmSend(chipIdx, parseInt(s.dataset.pwmCh), level);
}

boardsEl.addEventListener('change', (e) => {
  const s = e.target.closest('.pwm-slider');
  if (s) {
    pwmSliderSend(s, parseInt(s.value)).finally(() => { sliding = false; });
    return;
  }
  const freq = e.target.closest('[data-pwm-freq]');
  if (freq) setPwmFreq(parseInt(freq.dataset.pwmFreq), parseFloat(freq.value));
});

// Belt and braces: a drag that ends outside the slider (or is cancelled) never
// fires `change`, and a stuck `sliding` would freeze the whole panel's polling.
document.addEventListener('pointerup', () => { sliding = false; });
document.addEventListener('pointercancel', () => { sliding = false; });

document.addEventListener('keydown', (e) => {
  if (editing) return;

  // Don't capture if focus is in an input, modal, etc.
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

  const board = state.boards[focusedBoard];
  if (!board) return;

  const isBoardView = board.layout === 'board';
  const count = board.relays.length;

  // In PCB mode, navigate by visual position in the display order
  // Display order for 16ch: [8,0,9,1,10,2,...] in a 2-col grid
  // In grid mode, navigate by relay index with column awareness
  let cols, visPos, displayOrder;
  if (isBoardView) {
    displayOrder = boardDisplayOrder(board.size);
    if (board.flipped) displayOrder = [...displayOrder].reverse();
    cols = board.size > 8 ? 2 : 1;
    visPos = displayOrder.indexOf(board.relays[focusedRelay].num);
  } else {
    displayOrder = board.relays.map(r => r.num);
    if (board.flipped) displayOrder = [...displayOrder].reverse();
    cols = getGridCols();
    visPos = displayOrder.indexOf(board.relays[focusedRelay].num);
  }

  function setFocusFromVisPos(newVisPos) {
    const relayNum = displayOrder[newVisPos];
    focusedRelay = board.relays.findIndex(r => r.num === relayNum);
  }

  switch (e.key) {
    case 'ArrowRight':
      e.preventDefault();
      if (visPos + 1 < count) {
        setFocusFromVisPos(visPos + 1);
      } else {
        setFocusFromVisPos(0);
      }
      focusAndRender();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      if (visPos - 1 >= 0) {
        setFocusFromVisPos(visPos - 1);
      } else {
        setFocusFromVisPos(count - 1);
      }
      focusAndRender();
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (visPos + cols < count) {
        setFocusFromVisPos(visPos + cols);
      } else if (focusedBoard < state.boards.length - 1) {
        focusedBoard++;
        focusedRelay = 0;
      }
      focusAndRender();
      break;
    case 'ArrowUp':
      e.preventDefault();
      if (visPos - cols >= 0) {
        setFocusFromVisPos(visPos - cols);
      } else if (focusedBoard > 0) {
        focusedBoard--;
        const prevBoard = state.boards[focusedBoard];
        focusedRelay = Math.min(focusedRelay, prevBoard.relays.length - 1);
      }
      focusAndRender();
      break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      if (editMode) {
        startEditRelayName(focusedBoard, focusedRelay);
      } else if (board.relays[focusedRelay]) {
        toggleRelay(focusedBoard, board.relays[focusedRelay].num);
      }
      break;
    case 'e':
    case 'E':
      if (!editMode) { toggleEditMode(); break; }
      e.preventDefault();
      startEditRelayName(focusedBoard, focusedRelay);
      break;
    case 'a':
      e.preventDefault();
      setAll(focusedBoard, true);
      toast('All relays ON');
      break;
    case 'z':
      e.preventDefault();
      setAll(focusedBoard, false);
      toast('All relays OFF');
      break;
  }
});

// Click on relay card to focus it (skip gpio cards — they aren't in keyboard nav)
boardsEl.addEventListener('focus', (e) => {
  const card = e.target.closest('.relay-card');
  if (card && card.dataset.board != null) {
    focusedBoard = parseInt(card.dataset.board);
    focusedRelay = parseInt(card.dataset.ri);
  }
}, true);

function focusAndRender() {
  render();
  const card = boardsEl.querySelector(`.relay-card[data-board="${focusedBoard}"][data-ri="${focusedRelay}"]`);
  if (card) card.focus();
}

function getGridCols() {
  const section = boardsEl.querySelector(`.board-section[data-board-idx="${focusedBoard}"]`);
  if (!section) return 4;
  const grid = section.querySelector('.relay-grid') || section.querySelector('.board-outline');
  if (!grid) return 4;
  const style = getComputedStyle(grid);
  return style.gridTemplateColumns.split(' ').length;
}

// --- Inline editing ---
function startEditRelayName(boardIdx, relayIdx) {
  editing = true;
  const relay = state.boards[boardIdx]?.relays[relayIdx];
  if (!relay) return;
  const card = boardsEl.querySelector(`.relay-card[data-board="${boardIdx}"][data-ri="${relayIdx}"]`);
  if (!card) return;
  const nameEl = card.querySelector('.relay-name');
  const current = relay.name;
  nameEl.innerHTML = `<input class="relay-name-input" type="text" value="${escAttr(current)}">`;
  const input = nameEl.querySelector('input');
  input.focus();
  input.select();

  const finish = async (save) => {
    editing = false;
    if (save && input.value !== current) {
      await renameRelay(boardIdx, relay.num, input.value);
    }
    render();
    const newCard = boardsEl.querySelector(`.relay-card[data-board="${boardIdx}"][data-ri="${relayIdx}"]`);
    if (newCard) newCard.focus();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
  input.addEventListener('blur', () => finish(true));
}

function startEditGpioName(wpi) {
  editing = true;
  const g = state.gpios.find(x => x.wpi === wpi);
  if (!g) return;
  const card = boardsEl.querySelector(`.gpio-card[data-gpio-wpi="${wpi}"]`);
  if (!card) return;
  const nameEl = card.querySelector('.relay-name');
  const current = g.name;
  nameEl.innerHTML = `<input class="relay-name-input" type="text" value="${escAttr(current)}">`;
  const input = nameEl.querySelector('input');
  input.focus();
  input.select();

  const finish = async (save) => {
    editing = false;
    if (save && input.value !== current) {
      await renameGpio(wpi, input.value);
    }
    render();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
  input.addEventListener('blur', () => finish(true));
}

async function saveBoardSettings(boardIdx, addr, bus, size) {
  const result = await api('PUT', '/api/board/settings', {
    board: boardIdx, address: addr, bus: bus, size: size
  });
  if (result.error) {
    toast(result.error);
    return false;
  }
  return true;
}

function startEditBoardSettings(boardIdx) {
  editing = true;
  const board = state.boards[boardIdx];
  if (!board) return;
  const addrEl = boardsEl.querySelector(`.board-section[data-board-idx="${boardIdx}"] .board-addr`);
  if (!addrEl) return;

  const curAddr = board.address;
  const curBus = board.bus;
  const curSize = board.size;

  const sizeOptions = [1,2,4,8,16].map(s =>
    `<option value="${s}"${s === curSize ? ' selected' : ''}>${s}ch</option>`
  ).join('');

  addrEl.outerHTML = `<div class="board-settings-inline" data-board-idx="${boardIdx}">
    <label>addr</label>
    <input type="text" id="settAddr${boardIdx}" value="${curAddr}" style="width:4rem">
    <label>bus</label>
    <input type="number" id="settBus${boardIdx}" value="${curBus}" min="0" max="10" style="width:3rem">
    <label>size</label>
    <select id="settSize${boardIdx}">${sizeOptions}</select>
    <button class="btn-accent btn-sm" id="settSave${boardIdx}">Save</button>
    <button class="btn-surface btn-sm" id="settCancel${boardIdx}">Cancel</button>
  </div>`;

  const container = boardsEl.querySelector(`.board-settings-inline[data-board-idx="${boardIdx}"]`);
  container.querySelector(`#settAddr${boardIdx}`).focus();

  const finish = async (save) => {
    editing = false;
    if (save) {
      const newAddr = container.querySelector(`#settAddr${boardIdx}`).value || curAddr;
      const newBus = parseInt(container.querySelector(`#settBus${boardIdx}`).value) || curBus;
      const newSize = parseInt(container.querySelector(`#settSize${boardIdx}`).value) || curSize;
      if (newAddr !== curAddr || newBus !== curBus || newSize !== curSize) {
        const ok = await saveBoardSettings(boardIdx, newAddr, newBus, newSize);
        if (ok) {
          toast(`Updated to ${newAddr} bus:${newBus} ${newSize}ch`);
          fetchState();
          return;
        }
      }
    }
    render();
  };

  container.querySelector(`#settSave${boardIdx}`).addEventListener('click', (e) => {
    e.stopPropagation();
    finish(true);
  });
  container.querySelector(`#settCancel${boardIdx}`).addEventListener('click', (e) => {
    e.stopPropagation();
    finish(false);
  });

  container.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    e.stopPropagation();
  });
}

// --- Modal ---
function addBoardModal() {
  document.getElementById('addBoardModal').classList.add('open');
  document.getElementById('boardName').focus();
}

function closeModal() {
  document.getElementById('addBoardModal').classList.remove('open');
}

function addGpioModal() {
  document.getElementById('gpioWpi').value = '';
  document.getElementById('gpioPin').value = '';
  document.getElementById('gpioName').value = '';
  document.getElementById('addGpioModal').classList.add('open');
  document.getElementById('gpioWpi').focus();
}

function closeGpioModal() {
  document.getElementById('addGpioModal').classList.remove('open');
}

document.getElementById('addBoardModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('addGpioModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeGpioModal();
});

const PWM_MODALS = [
  ['addPwmModal', closePwmModal],
  ['addPwmChannelModal', closePwmChannelModal],
  ['pwmGroupModal', closePwmGroupModal],
];
for (const [id, close] of PWM_MODALS) {
  document.getElementById(id).addEventListener('click', (e) => {
    if (e.target === e.currentTarget) close();
  });
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('addBoardModal').classList.contains('open')) closeModal();
  if (document.getElementById('addGpioModal').classList.contains('open')) closeGpioModal();
  for (const [id, close] of PWM_MODALS) {
    if (document.getElementById(id).classList.contains('open')) close();
  }
});

// --- Toast ---
function toast(msg) {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// --- Helpers ---
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- Polling ---
// render() replaces boardsEl wholesale, which destroys whatever node the user
// is currently interacting with. An open <select> popup is anchored to its
// element, so a poll landing mid-click closes the menu instantly. Holding off
// while a control inside the panel has focus is self-correcting: clicking or
// tabbing away blurs it and polling resumes on the next tick.
function uiHoldsFocus() {
  const a = document.activeElement;
  if (!a || !boardsEl.contains(a)) return false;
  return a.tagName === 'SELECT' || a.classList.contains('pwm-slider');
}

function startPolling() {
  // Poll every 3 seconds for state changes (e.g. from other clients)
  const dot = document.getElementById('pollDot');
  pollTimer = setInterval(async () => {
    if (editing || sliding || uiHoldsFocus()) return;
    dot.classList.add('active');
    try {
      const newState = await api('GET', '/api/state');
      state = newState;
      render();
    } catch (e) {}
    setTimeout(() => dot.classList.remove('active'), 200);
  }, 1000);
}

// --- Init ---
fetchState().then(() => {
  startPolling();
  // Initial focus
  setTimeout(() => {
    const first = boardsEl.querySelector('.relay-card[tabindex="0"]');
    if (first) first.focus();
  }, 100);
});
